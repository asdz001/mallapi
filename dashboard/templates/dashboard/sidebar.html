
<!-- {# 
  📄 sidebar.html
  관리자 대시보드의 좌측 메뉴 템플릿
  - base_admin.html에서 include됨
  - 다국어(i18n) 적용: 한국어 / 영어 / 이탈리아어
  - 각 메뉴는 실제 URL/view 연결 예정 (지금은 placeholder 링크)
#} -->


{% load i18n %}
<aside class="main-sidebar sidebar-dark-primary elevation-4">
  <a href="{% url 'dashboard:home' %}" class="brand-link">
    <span class="brand-text font-weight-light text-light">{% trans "관리자 대시보드" %}</span>
  </a>

  <div class="sidebar">
    <nav class="mt-2">
      <ul class="nav nav-pills nav-sidebar flex-column" role="menu">

        <!-- 홈 -->
        <li class="nav-item">
          <a href="{% url 'dashboard:home' %}" class="nav-link">
            <i class="nav-icon fas fa-home"></i>
            <p>{% trans "대시보드" %}</p>
          </a>
        </li>

        <!-- 상품 관리 -->
        <li class="nav-item has-treeview menu-open">
          <a href="#" class="nav-link active bg-purple">
            <i class="nav-icon fas fa-box"></i>
            <p>
              {% trans "상품 관리" %}
              <i class="right fas fa-angle-left"></i>
            </p>
          </a>
          <ul class="nav nav-treeview">
            <li class="nav-item">
              <a href="{% url 'dashboard:product_list' %}" class="nav-link">
                <i class="far fa-circle nav-icon"></i>
                <p>{% trans "상품 목록" %}</p>
              </a>
            </li>

        <!-- 주문 관리 -->
        <li class="nav-item">
          <a href="#" class="nav-link">
            <i class="nav-icon fas fa-shopping-cart"></i>
            <p>{% trans "주문 관리" %}</p>
          </a>
        </li>

        <!-- 통계/분석 -->
        <li class="nav-item">
          <a href="#" class="nav-link">
            <i class="nav-icon fas fa-chart-line"></i>
            <p>{% trans "통계/분석" %}</p>
          </a>
        </li>

      </ul>
    </nav>
  </div>
</aside>
