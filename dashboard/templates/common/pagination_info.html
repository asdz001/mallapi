{% comment %}
<!-- 
========================================
📁 파일 위치: dashboard/templates/common/pagination_info.html
🎯 목적: 공통 페이지네이션 정보 및 설정 컴포넌트 (상단 표시용)
📅 버전: 1.1 (수정됨)
🔄 재사용: 모든 목록 페이지에서 사용 가능
========================================

사용법:
{% include 'common/pagination_info.html' with items=products sort_choices=sort_choices %}
{% include 'common/pagination_info.html' with items=members sort_choices=sort_choices %}
{% include 'common/pagination_info.html' with items=suppliers sort_choices=sort_choices %}

필수 변수:
- items: 페이지네이션된 객체 (Django Paginator 결과)

선택 변수:
- per_page_options: 페이지당 표시 옵션 리스트 (기본값 사용 가능)
- sort_choices: 정렬 옵션 리스트 (선택사항)
- sort_by: 현재 선택된 정렬 기준
- per_page: 현재 페이지당 표시 개수
-->
{% endcomment %}

{% load i18n %}

<!-- 📊 표시 설정 및 정렬 -->
<div class="card mb-3">
    <div class="card-body py-2">
        <div class="row align-items-center">
            
            <!-- 왼쪽: 현재 표시 정보 -->
            <div class="col-md-6">
                <span class="text-muted" style="font-size: 13px;">
                    {% if items.has_other_pages %}
                        {{ items.start_index }}-{{ items.end_index }} / 총 {{ items.paginator.count }}개
                    {% else %}
                        총 {{ items.paginator.count }}개
                    {% endif %}
                </span>
            </div>
            
            <!-- 오른쪽: 설정 옵션들 -->
            <div class="col-md-6">
                <div class="form-inline justify-content-end">
                    
                    <!-- 정렬 옵션 (sort_choices가 있을 때만 표시) -->
                    {% if sort_choices %}
                    <label class="mr-2" style="font-size: 13px;"><strong>{% trans "정렬" %}</strong></label>
                    <select name="sort" id="sort" class="form-control form-control-sm mr-3" 
                            style="width: 150px; font-size: 13px;" 
                            onchange="changeSort(this.value)">
                        {% for value, label in sort_choices %}
                            <option value="{{ value }}" {% if sort_by == value %}selected{% endif %}>
                                {{ label }}
                            </option>
                        {% endfor %}
                    </select>
                    {% endif %}
                    
                    <!-- 페이지당 표시 개수 -->
                    <label class="mr-2" style="font-size: 13px;"><strong>{% trans "표시설정" %}</strong></label>
                    <select name="per_page" id="per_page" 
                            class="form-control form-control-sm" 
                            style="width: 100px; font-size: 13px;" 
                            onchange="changePerPage(this.value)">
                        {% if per_page_options %}
                            <!-- 뷰에서 전달된 옵션들 사용 -->
                            {% for count in per_page_options %}
                                <option value="{{ count }}" {% if per_page == count %}selected{% endif %}>
                                    {{ count }}개씩
                                </option>
                            {% endfor %}
                        {% else %}
                            <!-- 기본 옵션들 -->
                            <option value="10" {% if per_page == 10 %}selected{% endif %}>10개씩</option>
                            <option value="25" {% if per_page == 25 %}selected{% endif %}>25개씩</option>
                            <option value="50" {% if per_page == 50 %}selected{% endif %}>50개씩</option>
                            <option value="100" {% if per_page == 100 %}selected{% endif %}>100개씩</option>
                        {% endif %}
                    </select>
                    
                </div>
            </div>
        </div>
    </div>
</div>

<!-- JavaScript 함수들 -->
<script>
// 🔧 정렬 변경 함수
function changeSort(sortValue) {
    const currentUrl = new URL(window.location);
    currentUrl.searchParams.set('sort', sortValue);
    currentUrl.searchParams.delete('page'); // 페이지는 1로 리셋
    window.location.href = currentUrl.toString();
}

// 🔧 페이지당 표시 개수 변경 함수
function changePerPage(value) {
    const currentUrl = new URL(window.location);
    currentUrl.searchParams.set('per_page', value);
    currentUrl.searchParams.delete('page'); // 페이지는 1로 리셋
    window.location.href = currentUrl.toString();
}

// 🔧 jQuery 로드 후 실행 (search_engine.js와 중복 방지)
$(document).ready(function() {
    // 이미 search_engine.js에서 처리되지 않은 경우에만 이벤트 바인딩
    if (!window.SearchEngine) {
        console.log('SearchEngine 미로드 - pagination_info.html에서 이벤트 바인딩');
        
        // 정렬 변경 이벤트
        $('#sort').off('change.pagination').on('change.pagination', function() {
            changeSort(this.value);
        });
        
        // 페이지당 표시 개수 변경 이벤트
        $('#per_page').off('change.pagination').on('change.pagination', function() {
            changePerPage(this.value);
        });
    }
});
</script>
